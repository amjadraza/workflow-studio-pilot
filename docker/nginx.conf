server {
  listen 80;
  root /usr/share/nginx/html;

  location / {
    try_files $uri /index.html;
  }

  # Settings change per container: never cache them
  location = /config.js {
    add_header Cache-Control "no-store";
  }

  # Built files have hashed names: cache them for a long time
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
